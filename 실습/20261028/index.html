<!DOCTYPE html>
<html lang="ko"> <!-- 사이트 언어 인식. 번역기능지원에도 사용됨 -->
<head>
    <meta charset="UTF-8"> <!-- 문자셋 설정. 없으면 깨지는 언어가 존재한다. 주소창 등에서 한글 불러오는데 실패하는 등. 이 경우엔 api요청이 필요할 수 있음 -->
    <!-- 주소창 체계는 중요함. 무언가 이벤트, 광고 등을 통해 리다이렉트 하여 들어오는 경우 모두 주소창에 남는다. 주소창에 남는 정보를 이용해 유입률, 광고수익등을 측정하는데에 사용할 수 있다. -->
    <meta name=""viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면에 맞게 화면을 조정. 없으면 모바일에서 화면이 깨짐 -->
    <meta name="description" content="설명"> <!-- 검색엔진에 노출되는 설명. 없으면 검색엔진이 임의로 설정함. -->
    <meta name="keywords" content="키워드"> <!-- 검색엔진에 노출되는 키워드. 없으면 검색엔진이 임의로 설정함. -->
    <meta name="author" content="작성자"> <!-- 작성자. 없으면 검색엔진이 임의로 설정함. -->
    <meta name="og:title" content=""> <!-- 공유하기를 통해 보여주는 제목 -->
    <meta name="og:url" content=""> <!-- 공유하기를 통해 보여주는 url -->
    <meta name="og:image" content=""> <!-- 공유하기를 통해 보여주는 이미지 -->
    <title>Document</title>
</head>
<body>
    <h1>H1 제목</h1>
    <p>테스트 페이지입니다.</p>
    <p>테스트 페이지입니다..</p>
</body>
